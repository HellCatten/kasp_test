services:
  # --- Нода 1 (Инициализатор кластера) ---
  mariadb-galera-1:
    image: mariadb:11.4
    container_name: mariadb-galera-1
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        if [ -f /var/lib/mysql/grastate.dat ]; then
          sed -i 's/safe_to_bootstrap: 0/safe_to_bootstrap: 1/' /var/lib/mysql/grastate.dat
        fi
        exec docker-entrypoint.sh mariadbd \
          --wsrep-on=ON \
          --wsrep-provider=/usr/lib/galera/libgalera_smm.so \
          --wsrep-new-cluster \
          --wsrep-cluster-name=kuma_galera_cluster \
          --wsrep-cluster-address=gcomm://mariadb-galera-1,mariadb-galera-2,mariadb-galera-3 \
          --wsrep-node-name=node1 \
          --wsrep-node-address=mariadb-galera-1 \
          --wsrep-sst-method=mariabackup \
          --wsrep-sst-auth="root:${MARIADB_ROOT_PASSWORD}" \
          --binlog-format=ROW \
          --default-storage-engine=InnoDB \
          --innodb-autoinc-lock-mode=2 \
          --bind-address=0.0.0.0
    volumes:
      - galera1_data:/var/lib/mysql
      - ./init-exporter.sql:/docker-entrypoint-initdb.d/init-exporter.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - platform_net
    security_opt:
      - no-new-privileges:true

  # --- Нода 2 ---
  mariadb-galera-2:
    image: mariadb:11.4
    container_name: mariadb-galera-2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=kuma_galera_cluster
      - --wsrep-cluster-address=gcomm://mariadb-galera-1,mariadb-galera-2,mariadb-galera-3
      - --wsrep-node-name=node2
      - --wsrep-node-address=mariadb-galera-2
      - --wsrep-sst-method=mariabackup
      - --wsrep-sst-auth="root:${MARIADB_ROOT_PASSWORD}"
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --bind-address=0.0.0.0
    volumes:
      - galera2_data:/var/lib/mysql
    #depends_on:
    #  mariadb-galera-1:
    #    condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - platform_net
    security_opt:
      - no-new-privileges:true

  # --- Нода 3 ---
  mariadb-galera-3:
    image: mariadb:11.4
    container_name: mariadb-galera-3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=kuma_galera_cluster
      - --wsrep-cluster-address=gcomm://mariadb-galera-1,mariadb-galera-2,mariadb-galera-3
      - --wsrep-node-name=node3
      - --wsrep-node-address=mariadb-galera-3
      - --wsrep-sst-method=mariabackup
      - --wsrep-sst-auth="root:${MARIADB_ROOT_PASSWORD}"
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --bind-address=0.0.0.0
    volumes:
      - galera3_data:/var/lib/mysql
    #depends_on:
    #  mariadb-galera-1:
    #    condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - platform_net
    security_opt:
      - no-new-privileges:true

  # --- HAProxy (Балансировщик) ---
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:3306:3306"
      - "127.0.0.1:8404:8404"
    depends_on:
      mariadb-galera-1:
        condition: service_healthy
    networks:
      - platform_net
    security_opt:
      - no-new-privileges:true

  # --- Uptime Kuma ---
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-slim
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma_data:/app/data
    environment:
      TZ: ${TZ}
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: haproxy
      UPTIME_KUMA_DB_PORT: 3306
      UPTIME_KUMA_DB_USERNAME: ${MARIADB_USER}
      UPTIME_KUMA_DB_PASSWORD: ${MARIADB_PASSWORD}
      UPTIME_KUMA_DB_NAME: ${MARIADB_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({ host: '127.0.0.1', port: 3001, path: '/', timeout: 3000 }, (r) => { process.exit(r.statusCode < 400 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.on('timeout', () => { req.destroy(); process.exit(1); }); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      haproxy:
        condition: service_started
    networks:
      - platform_net
    security_opt:
      - no-new-privileges:true

volumes:
  galera1_data:
  galera2_data:
  galera3_data:
  kuma_data:

networks:
  platform_net:
    name: platform_net
    driver: bridge