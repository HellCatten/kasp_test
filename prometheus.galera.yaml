global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Сбор телеметрии с каждой ноды Galera Cluster
  - job_name: 'galera-cluster'
    static_configs:
      - targets: ['mysqld-exporter-1:9104']
        labels:
          node: 'node1'
          role: 'bootstrap'
      - targets: ['mysqld-exporter-2:9104']
        labels:
          node: 'node2'
          role: 'replica'
      - targets: ['mysqld-exporter-3:9104']
        labels:
          node: 'node3'
          role: 'replica'

  # Метрики балансировщика HAProxy
  - job_name: 'haproxy'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['haproxy:8404']

  # Метрики Uptime Kuma с авторизацией по токену
  - job_name: 'uptime-kuma'
    scrape_interval: 30s
    metrics_path: '/metrics'
    basic_auth:
      password_file: '/etc/prometheus/secrets/kuma.token'
    static_configs:
      - targets: ['uptime-kuma:3001']