global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mariadb'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  # Нативный эндпоинт Uptime Kuma (Settings -> Prometheus Metrics)
  - job_name: 'uptime-kuma'
    scrape_interval: 30s
    metrics_path: '/metrics'
    # Автоматическая генерация в Dagger.
    # При использовании вручную сохраняйте api ключ в папке /secrets
    # или вводите username: '' password: 'token'
    basic_auth:
      password_file: '/etc/prometheus/secrets/kuma.token'
    static_configs:
      - targets: ['uptime-kuma:3001']