global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Встроенный эндпоинт Prometheus метрик
frontend stats
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s

# Фронтенд для MySQL подключений (сюда стучится Uptime Kuma)
frontend mysql_front
    bind *:3306
    mode tcp
    option tcplog
    default_backend mysql_cluster

# Бэкенд с нодами Galera
backend mysql_cluster
    mode tcp
    option tcp-check
    balance roundrobin

    # Node 1 — основная нода для записи
    server galera1 mariadb-galera-1:3306 check port 3306 inter 3s fall 3 rise 2
    # Node 2 и 3 — standby ноды (включаются автоматически, если Node 1 упадет)
    server galera2 mariadb-galera-2:3306 check port 3306 inter 3s fall 3 rise 2 backup
    server galera3 mariadb-galera-3:3306 check port 3306 inter 3s fall 3 rise 2 backup
