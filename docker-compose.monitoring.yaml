services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus.yaml}:/etc/prometheus/prometheus.yaml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    command: 
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: monitoring_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|mnt)($$|/)'
      # Игнорируем типы ФС виртуализации WSL
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|drvfs|9p|virtiofs)($$|/)'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  cadvisor:
    image: ghcr.io/google/cadvisor:0.57
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=10s'
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    restart: unless-stopped
    profiles: ["single"]
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
      - '--mysqld.address=mariadb:3306'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.info_schema.tablestats'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  mysqld-exporter-1:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-1
    restart: unless-stopped
    profiles: ["galera"]
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
      - '--mysqld.address=mariadb-galera-1:3306'
      - '--collect.global_status'
      - '--collect.info_schema.innodb_metrics'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  mysqld-exporter-2:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-2
    restart: unless-stopped
    profiles: ["galera"]
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
      - '--mysqld.address=mariadb-galera-2:3306'
      - '--collect.global_status'
      - '--collect.info_schema.innodb_metrics'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  mysqld-exporter-3:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter-3
    restart: unless-stopped
    profiles: ["galera"]
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    command:
      - '--config.my-cnf=/etc/.my.cnf'
      - '--mysqld.address=mariadb-galera-3:3306'
      - '--collect.global_status'
      - '--collect.info_schema.innodb_metrics'
    networks:
      - platform_net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

volumes:
  prometheus_data:
  grafana_data:

networks:
  platform_net:
    name: platform_net
    external: true